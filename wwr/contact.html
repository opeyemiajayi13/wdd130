<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact White Water Rafting Adventures for rafting trips, questions, reservations, and more information about our exciting river adventures.">

    <meta name="author" content="Opeyemi Ajayi">
    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <a class="logo-link" href="index.html">
            <img src="images/logo.jpeg" alt="White Water Rafting logo">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>

            <p>
                250 River St Unit 123, Santa Cruz<br>
                CA 95060, USA
            </p>

            <p>
                +1 702 580 9895<br>
                info@whitewaterrafting.com
            </p>
        </section>

        <section class="contact-section">

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3187.236861202673!2d-122.03272642408758!3d36.98027901074764!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808e40301766651d%3A0xcaa891114d006ca5!2s250%20River%20St%20Unit%20123%2C%20Santa%20Cruz%2C%20CA%2095060%2C%20USA!5e0!3m2!1sen!2sng!4v1785954924870!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>

                <fieldset>
                    <legend>Message Purpose:</legend>

                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="website">
                        <input type="radio" id="website" name="purpose" value="website">
                        Website Suggestion
                    </label>

                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>

            </form>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-cards">

                <figure>
                    <img src="images/employee1.jpeg" alt="Photo of employee John Smith">
                    <figcaption>John Smith — River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpeg" alt="Photo of employee Maria Lopez">
                    <figcaption>Maria Lopez — Trip Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpeg" alt="Photo of employee David Kim">
                    <figcaption>David Kim — Safety Specialist</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>© 2026 White Water Rafting Company | Opeyemi Ajayi</p>

        <nav class="socialmedia">


            <a href="#">
                <img src="images/facebook.jpeg" alt="Facebook">
            </a>

            <a href="#">
                <img src="images/instagram.jpeg" alt="Instagram">
            </a>

            <a href="#">
                <img src="images/youtube.jpeg" alt="YouTube">
            </a>

        </nav>

    </footer>

</body>

</html>
